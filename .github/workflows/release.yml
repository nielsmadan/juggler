name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      version: ${{ steps.version.outputs.version }}
      ed-signature: ${{ steps.sparkle.outputs.ed-signature }}
      zip-length: ${{ steps.sparkle.outputs.zip-length }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nielsmadan/curtaincall@v1.2.0

      - name: Validate annotated tag and ancestry
        id: identity
        if: github.event_name == 'push'
        run: |
          RELEASE_COMMIT=$(curtains ci validate-tag "$GITHUB_REF_NAME" "$GITHUB_SHA")
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check the app version
        id: version
        env:
          IS_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          VERSION=$(python3 - <<'PYVERSION'
          import re
          from pathlib import Path
          versions = set(re.findall(r"MARKETING_VERSION = ([^;]+);", Path("Juggler.xcodeproj/project.pbxproj").read_text()))
          if len(versions) != 1:
              raise SystemExit("Expected one app version")
          print(versions.pop())
          PYVERSION
          )
          if [ "$IS_RELEASE" = "true" ] && [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "MARKETING_VERSION $VERSION does not match $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test packaging and integration cleanup
        run: |
          python3 -m unittest discover -s scripts/tests -v
          brew ruby scripts/tests/homebrew_lifecycle.rb

      - name: Stage published hooklinesinker
        run: |
          python3 scripts/update_hooklinesinker.py --check
          python3 scripts/hooklinesinker.py stage --published

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          mkdir -p release
          xcodebuild -scheme Juggler -configuration Release \
            -archivePath release/Juggler.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export with Developer ID signing
        run: |
          xcodebuild -exportArchive \
            -archivePath release/Juggler.xcarchive \
            -exportPath release/export \
            -exportOptionsPlist ExportOptions.plist

          echo "Verifying code signature..."
          python3 scripts/hooklinesinker.py verify release/export/Juggler.app --distribution

      - name: Create ZIP
        run: cd release/export && zip -r -y ../Juggler.zip Juggler.app

      - name: Notarize
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          xcrun notarytool submit release/Juggler.zip \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple release/export/Juggler.app
          spctl --assess --type execute --verbose=2 release/export/Juggler.app

          echo "Re-creating ZIP with stapled app..."
          rm -f release/Juggler.zip
          cd release/export && zip -r -y ../Juggler.zip Juggler.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Juggler" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Juggler.app" 180 190 \
            --hide-extension "Juggler.app" \
            --app-drop-link 480 190 \
            release/Juggler.dmg \
            release/export/

      - name: Notarize DMG
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          xcrun notarytool submit release/Juggler.dmg \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait
          xcrun stapler staple release/Juggler.dmg

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 release/Juggler.zip | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA256 (ZIP): $SHA256"

          DMG_SHA256=$(shasum -a 256 release/Juggler.dmg | cut -d' ' -f1)
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"
          echo "SHA256 (DMG): $DMG_SHA256"

      - name: Validate app and generate Homebrew cask
        run: |
          python3 scripts/render-homebrew-cask.py render "$VERSION" \
            release/export/Juggler.app release/Juggler.dmg release/juggler.rb
          ruby -c release/juggler.rb

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.8.1"
          SPARKLE_SHA256="5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign update with EdDSA
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ED_SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - -p release/Juggler.zip)
          ZIP_LENGTH=$(stat -f%z release/Juggler.zip)
          echo "ed-signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "zip-length=$ZIP_LENGTH" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ED_SIGNATURE"
          echo "ZIP length: $ZIP_LENGTH"

      - name: Write release notes
        if: github.event_name == 'push'
        run: |
          PREV_TAG=$(curtains ci previous-tag "$GITHUB_REF_NAME")
          RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
          NOTES=$(git log --no-merges --pretty=format:"- %s" "$RANGE" \
            | { grep -Ev '^- chore(\([^)]*\))?!?:' || true; })

          {
            echo "## What's Changed"
            echo ""
            echo "${NOTES:-- Maintenance updates}"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/nielsmadan/juggler/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > release/release-notes.md

      - name: Save release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: juggler-release
          path: |
            release/Juggler.zip
            release/Juggler.dmg
            release/juggler.rb
            release/release-notes.md
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nielsmadan/curtaincall@v1.2.0

      - name: Revalidate release tag
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: test "$(curtains ci validate-tag "$GITHUB_REF_NAME" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"

      - name: Download release bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: juggler-release
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curtains ci publish "$GITHUB_REF_NAME" "$RELEASE_COMMIT" \
            --notes release/release-notes.md \
            --title "Juggler $VERSION" \
            release/Juggler.zip release/Juggler.dmg

  homebrew:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          path: release-tools

      - name: Download release bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: juggler-release
          path: release

      - uses: actions/checkout@v7.0.1
        with:
          repository: nielsmadan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew tap
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          CASK_ACTION=$(python3 release-tools/scripts/render-homebrew-cask.py publish \
            release/juggler.rb homebrew-tap/Casks/juggler.rb)
          if [ "$CASK_ACTION" = "skipped-newer" ]; then
            echo "A newer Homebrew cask is already published"
            exit 0
          fi
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/juggler.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is current"
            exit 0
          fi
          git commit -m "Update Juggler to $VERSION"
          git push origin HEAD:main

  appcast:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Update Sparkle appcast
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ZIP_LENGTH: ${{ needs.build.outputs.zip-length }}
          ED_SIGNATURE: ${{ needs.build.outputs.ed-signature }}
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          APPCAST_ACTION=$(python3 scripts/update_appcast.py appcast.xml \
            "$VERSION" "$ZIP_LENGTH" "$ED_SIGNATURE" "$PUB_DATE")
          if [ "$APPCAST_ACTION" = "present" ]; then
            echo "The appcast already lists $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for v${VERSION}"
          git push origin HEAD:main
